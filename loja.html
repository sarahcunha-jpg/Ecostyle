<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja – EcoStyle</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-grid">
      <a href="index.html" class="logo">EcoStyle</a>
      <nav class="nav">
        <a href="loja.html" class="active">Loja</a>
        <a href="transparencia.html">Transparência</a>
        <a href="sobre.html">Sobre</a>
      </nav>
      <div class="header-actions">
        <span class="cart-icon" id="cartIcon">🛒 <span id="cartCount">0</span></span>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Loja</h1>

    <!-- Filtros -->
    <aside class="filtros">
      <h3>Filtrar produtos</h3>
      <div class="filtro-grupo">
        <label>Categoria</label>
        <select id="filtroCategoria">
          <option value="todos">Todos</option>
          <option value="camiseta">Camisetas</option>
          <option value="moletom">Moletons</option>
          <option value="cargo">Calças Cargo</option>
          <option value="jeans">Jeans</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label>Matéria-prima</label>
        <select id="filtroMaterial">
          <option value="todos">Todos</option>
          <option value="Algodão Orgânico">Algodão Orgânico</option>
          <option value="Poliéster Reciclado">Poliéster Reciclado</option>
          <option value="Tencel">Tencel</option>
          <option value="Jeans Reciclado">Jeans Reciclado</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <label>Tamanho</label>
        <select id="filtroTamanho">
          <option value="todos">Todos</option>
          <option value="P">P</option>
          <option value="M">M</option>
          <option value="G">G</option>
          <option value="GG">GG</option>
        </select>
      </div>
      <button id="aplicarFiltros" class="btn btn-secondary">Aplicar</button>
    </aside>

    <!-- Grid de produtos -->
    <section class="produtos-grid" id="lojaGrid">
      <!-- Preenchido via JS -->
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 EcoStyle – Vestindo o futuro com consciência.</p>
    </div>
  </footer>

  <script src="js/produtos.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
